    <script>
      (function () {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function () {
          var first = arguments[0] && typeof arguments[0] === 'string' ? arguments[0] : '';
          if (
            first.indexOf('cdn.tailwindcss.com') !== -1 ||
            first.indexOf('width(-1) and height(-1) of chart') !== -1
          ) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        console.error = function () {
          var first = arguments[0] && typeof arguments[0] === 'string' ? arguments[0] : '';
          if (first.indexOf('[vite] failed to connect to websocket') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason && e.reason.message ? String(e.reason.message) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>

    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Segoe UI Variable Text"', '"Segoe UI"', '"Plus Jakarta Sans"', '"Inter"', 'Helvetica Neue', 'Arial', 'sans-serif'],
              display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI Variable Display"', '"Segoe UI"', '"Plus Jakarta Sans"', '"Inter"', 'sans-serif'], 
            },
            colors: {
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                light: 'hsl(var(--primary-light))',
                dark: 'hsl(var(--primary-dark))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                light: 'hsl(var(--accent-light))',
                dark: 'hsl(var(--accent-dark))',
              },
              background: 'hsl(var(--page-background))', 
              foreground: 'hsl(var(--page-foreground))', 
              
              'panel-light': 'var(--panel-bg-light)', 
              'panel-dark': 'var(--panel-bg-dark)',    
              
              'border-light': 'var(--panel-border-light)', 
              'border-dark': 'var(--panel-border-dark)',

              card: 'hsl(var(--card))',
              'dark-card': 'hsl(var(--dark-card))',

              // Pastel Palette Tokens
              'soft-blue': '#78B7FF',
              'soft-orange': '#FF9E72',
              'soft-lavender': '#D8CCFF',
              'soft-peach': '#FFD8CC',
              'soft-mint': '#C8F5E3',
              'soft-rose': '#FFD6E6',

              // Semantic Text Tokens
              'text-primary': '#1F2937',
              'text-secondary': '#64748B',
              'text-muted': '#94A3B8',
              'text-disabled': '#CBD5E1',

              'neon-accent': 'hsl(var(--neon-accent))', 
              'neon-accent-secondary': 'hsl(var(--neon-accent-secondary))',
              'landing-bg': 'hsl(var(--landing-bg))',
              'landing-bg-darker': 'hsl(var(--landing-bg-darker))',
              'landing-border': 'hsl(var(--landing-border))',

              // Status colors
              status_success: 'hsl(var(--status-success))',
              status_warning: 'hsl(var(--status-warning))',
              status_error: 'hsl(var(--status-error))',
              status_neutral: 'hsl(var(--status-neutral))',
              status_info: 'hsl(var(--status-info))',
            },
            borderRadius: {
              'none': '0px',
              'sm': '1rem',      // 16px Tooltips
              'md': '1.25rem',   // 20px Dropdowns
              'lg': '1.5rem',    // 24px Popovers
              'xl': '1.875rem',  // 30px Panels, Sidebar, Header
              '2xl': '1.75rem',  // 28px Cards
              '3xl': '2rem',      // 32px Modals
              '4xl': '2.25rem',
              'full': '9999px',  // Buttons, Badges, Progress
              'squircle-sm': '1.125rem', // 18px Inputs
              'squircle-md': '1.75rem',  // 28px Cards
              'squircle-lg': '1.875rem', // 30px Panels
            },
            boxShadow: {
              'glass': '0 10px 30px rgba(15, 23, 42, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.60)',
              'glass-lg': '0 18px 40px rgba(15, 23, 42, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.70)',
              'inner-glass': 'inset 0 1px 2px 0 rgba(255, 255, 255, 0.6), inset 0 0.5px 1px 0 rgba(255, 255, 255, 0.3)',
              'subtle-glow-light': '0 0 20px 5px rgba(105, 87, 255, 0.15)',
              'subtle-glow-dark': '0 0 25px 5px rgba(105, 87, 255, 0.25)',
              'level-1': '0 2px 8px rgba(15, 23, 42, 0.04)',
              'level-2': '0 8px 24px rgba(15, 23, 42, 0.05)',
              'level-3': '0 18px 40px rgba(15, 23, 42, 0.07)',
            },
            keyframes: {
              slowGradientShift: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              spinner: { 'to': { transform: 'rotate(360deg)' } },
              checkmarkAppear: {
                '0%': { opacity: '0', transform: 'scale(0.5) rotate(-45deg)' },
                '70%': { opacity: '1', transform: 'scale(1.1) rotate(0deg)' },
                '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)' },
              },
              faqOpen: { '0%': { opacity: '0', transform: 'translateY(-8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' },
              },
              gridPan: {
                '0%': { 'background-position': '0% 0%' },
                '100%': { 'background-position': '100% 100%' },
              },
              globeCoreSpin: {
                'from': { transform: 'rotateY(0deg) rotateX(0deg)' },
                'to': { transform: 'rotateY(360deg) rotateX(360deg)' },
              },
              globeOrbit1: {
                'from': { transform: 'rotateZ(0deg) rotateY(65deg) rotateX(10deg)' },
                'to': { transform: 'rotateZ(360deg) rotateY(65deg) rotateX(10deg)' },
              },
              globeOrbit2: {
                'from': { transform: 'rotateZ(0deg) rotateY(-65deg) rotateX(15deg)' },
                'to': { transform: 'rotateZ(-360deg) rotateY(-65deg) rotateX(15deg)' },
              },
              globeOrbit3: {
                'from': { transform: 'rotateY(0deg) rotateX(80deg) rotateZ(20deg)' },
                'to': { transform: 'rotateY(360deg) rotateX(80deg) rotateZ(20deg)' },
              },
              satellitePulse: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 4px 1px hsla(var(--neon-accent-secondary-rgb), 0.7)' },
                '50%': { transform: 'scale(1.2)', boxShadow: '0 0 8px 3px hsla(var(--neon-accent-secondary-rgb), 0.9)' },
              },
              floatUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              modalZoomIn: {
                '0%': { opacity: '0', transform: 'scale(0.95) translateY(6px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              modalZoomOut: {
                '0%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                '100%': { opacity: '0', transform: 'scale(0.96) translateY(4px)' },
              },
              bubbleStretchTop: {
                '0%': { transform: 'scaleY(1) translateY(0)' },
                '35%': { transform: 'scaleY(1.018) translateY(5px)', transformOrigin: 'top center' },
                '70%': { transform: 'scaleY(0.996) translateY(-1px)', transformOrigin: 'top center' },
                '100%': { transform: 'scaleY(1) translateY(0)', transformOrigin: 'top center' },
              },
              bubbleStretchBottom: {
                '0%': { transform: 'scaleY(1) translateY(0)' },
                '35%': { transform: 'scaleY(1.018) translateY(-5px)', transformOrigin: 'bottom center' },
                '70%': { transform: 'scaleY(0.996) translateY(1px)', transformOrigin: 'bottom center' },
                '100%': { transform: 'scaleY(1) translateY(0)', transformOrigin: 'bottom center' },
              },
            },
            animation: {
              slowGradientShift: 'slowGradientShift 45s ease infinite',
              fadeIn: 'fadeIn 0.4s ease-out forwards',
              spinner: 'spinner 0.7s linear infinite',
              checkmarkAppear: 'checkmarkAppear 0.35s ease-out forwards',
              faqOpen: 'faqOpen 0.25s ease-out forwards',
              shimmer: 'shimmer 2s infinite linear',
              gridPan: 'gridPan 120s linear infinite alternate',
              floatUp: 'floatUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards',
              modalZoomIn: 'modalZoomIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              modalZoomOut: 'modalZoomOut 0.18s cubic-bezier(0.4, 0, 1, 1) forwards',
              bubbleStretchTop: 'bubbleStretchTop 0.48s cubic-bezier(0.22, 1, 0.36, 1)',
              bubbleStretchBottom: 'bubbleStretchBottom 0.48s cubic-bezier(0.22, 1, 0.36, 1)',
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        :root {
          /* Light Mode - 2026 Apple Liquid Glass Aesthetic */
          --page-background-base-light: 220 25% 97%; /* #F5F7FB */
          --page-foreground-light: 215 28% 17%; /* #1F2937 */
          --panel-bg-light: 0 0% 100%;
          --panel-border-light: 220 30% 90%;
          --card-bg-light: 0 0% 100%;
          --card-border-light: 220 30% 90%;

          /* Dynamic Workspace Accent Tokens (Default: Electric Violet #6957FF) */
          --primary: 245 100% 67%; /* #6957FF */
          --primary-rgb: 105, 87, 255; 
          --primary-light: 244 100% 72%; /* #857CFF */
          --primary-dark: 246 84% 58%; /* #5544E8 */
          --primary-foreground: 0 0% 100%;
          --accent: var(--primary);
          --accent-rgb: var(--primary-rgb);
          --accent-light: var(--primary-light);
          --accent-dark: var(--primary-dark);
          --accent-hex: #6957FF;
          --accent-gradient-start: #7C6BFF;
          --accent-gradient-end: #5B4AEE;
          --shadow-color-rgb: 15, 23, 42;
          
          /* Status Colors */
          --status-success: 145 63% 49%;
          --status-warning: 35 84% 62%;
          --status-error: 0 72% 51%;  
          --status-neutral: 215 20% 65%;
          --status-info: 200 80% 55%; 

          /* Landing Page Colors */
          --neon-accent: var(--primary); 
          --neon-accent-rgb: var(--primary-rgb);
          --neon-accent-secondary: 212 100% 73%;
          --neon-accent-secondary-rgb: 120, 183, 255;
          --landing-bg: 240 20% 10%;
          --landing-bg-darker: 240 25% 7%;
          --landing-border: 240 15% 20%;
        }

        html[data-accent="cyan"] {
          --primary: 199 96% 40%;
          --primary-rgb: 2, 132, 199;
          --primary-light: 199 95% 60%;
          --primary-dark: 201 96% 32%;
          --accent-hex: #0284C7;
          --accent-gradient-start: #06B6D4;
          --accent-gradient-end: #0284C7;
        }
        html[data-accent="emerald"] {
          --primary: 160 84% 35%;
          --primary-rgb: 5, 150, 105;
          --primary-light: 158 64% 52%;
          --primary-dark: 161 94% 28%;
          --accent-hex: #059669;
          --accent-gradient-start: #10B981;
          --accent-gradient-end: #059669;
        }
        html[data-accent="coral"] {
          --primary: 347 77% 50%;
          --primary-rgb: 225, 29, 72;
          --primary-light: 351 95% 71%;
          --primary-dark: 345 83% 41%;
          --accent-hex: #E11D48;
          --accent-gradient-start: #F43F5E;
          --accent-gradient-end: #E11D48;
        }
        html[data-accent="amber"] {
          --primary: 32 95% 44%;
          --primary-rgb: 217, 119, 6;
          --primary-light: 43 96% 56%;
          --primary-dark: 26 90% 37%;
          --accent-hex: #D97706;
          --accent-gradient-start: #F59E0B;
          --accent-gradient-end: #D97706;
        }
        html[data-accent="cobalt"] {
          --primary: 221 83% 53%;
          --primary-rgb: 37, 99, 235;
          --primary-light: 213 94% 68%;
          --primary-dark: 224 76% 45%;
          --accent-hex: #2563EB;
          --accent-gradient-start: #3B82F6;
          --accent-gradient-end: #1D4ED8;
        }

        html.dark { 
          --page-background-base-dark: 222 47% 11%; /* #0F172A */
          --page-foreground-dark: 210 40% 96%; /* #F8FAFC */
          --panel-bg-dark: 222 47% 11%;
          --panel-border-dark: 217 33% 20%;
          --card-bg-dark: 222 47% 11%;
          --card-border-dark: 217 33% 20%;
          --shadow-color-rgb: 0, 0, 0;
          --primary: 244 100% 72%; /* #857CFF */
          --primary-rgb: 133, 124, 255;
          --primary-foreground: 222 47% 11%;
          --accent-hex: #857CFF;
        }
        html.dark[data-accent="cyan"] {
          --primary: 199 95% 60%;
          --primary-rgb: 56, 189, 248;
          --accent-hex: #38BDF8;
        }
        html.dark[data-accent="emerald"] {
          --primary: 158 64% 52%;
          --primary-rgb: 52, 211, 153;
          --accent-hex: #34D399;
        }
        html.dark[data-accent="coral"] {
          --primary: 351 95% 71%;
          --primary-rgb: 251, 113, 133;
          --accent-hex: #FB7185;
        }
        html.dark[data-accent="amber"] {
          --primary: 43 96% 56%;
          --primary-rgb: 251, 191, 36;
          --accent-hex: #FBBF24;
        }
        html.dark[data-accent="cobalt"] {
          --primary: 213 94% 68%;
          --primary-rgb: 96, 165, 250;
          --accent-hex: #60A5FA;
        }
        
        :root {
          --page-background: var(--page-background-base-light);
          --page-foreground: var(--page-foreground-light);
          --panel-background: var(--panel-bg-light);
          --panel-border: var(--panel-border-light);
          --card-background: var(--card-bg-light);
          --card-border: var(--card-border-light);
        }
        html.dark {
          --page-background: var(--page-background-base-dark);
          --page-foreground: var(--page-foreground-dark);
          --panel-background: var(--panel-bg-dark);
          --panel-border: var(--panel-border-dark);
          --card-background: var(--card-bg-dark);
          --card-border: var(--card-border-dark);
        }

        body { 
          color: #1F2937;
          background-color: #F8FAFC;
          background-image: 
            radial-gradient(at 15% 15%, rgba(var(--primary-rgb), 0.14) 0px, transparent 50%),
            radial-gradient(at 85% 20%, rgba(120, 183, 255, 0.14) 0px, transparent 50%),
            radial-gradient(at 50% 80%, rgba(var(--primary-rgb), 0.10) 0px, transparent 50%),
            radial-gradient(at 80% 85%, rgba(255, 255, 255, 0.85) 0px, transparent 60%),
            linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 50%, #E2E8F0 100%);
          background-size: 160% 160%;
          background-attachment: fixed;
          animation: animateBackgroundMesh 30s ease-in-out infinite;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", "Plus Jakarta Sans", "Inter", sans-serif;
          font-weight: 300;
          font-feature-settings: "cv02", "cv03", "cv04", "cv11";
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          text-rendering: optimizeLegibility;
          letter-spacing: -0.008em;
          line-height: 1.6;
          transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        h1, h2, h3, h4, h5, h6 {
          font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Inter", sans-serif;
          letter-spacing: -0.022em;
        }

        .tabular-nums, .font-mono {
          font-variant-numeric: tabular-nums;
        }

        html.dark body {
          color: #F8FAFC;
          background-color: #070A12;
          background-image: 
            radial-gradient(at 15% 15%, rgba(var(--primary-rgb), 0.25) 0px, transparent 50%),
            radial-gradient(at 85% 20%, rgba(59, 130, 246, 0.18) 0px, transparent 50%),
            radial-gradient(at 50% 80%, rgba(var(--primary-rgb), 0.16) 0px, transparent 50%),
            linear-gradient(135deg, #070A12 0%, #0F172A 50%, #131728 100%);
          background-size: 160% 160%;
          background-attachment: fixed;
          animation: animateBackgroundMesh 30s ease-in-out infinite;
        }

        /* Theme-aware overrides when non-default workspace accent is selected */
        html[data-accent]:not([data-accent="violet"]) .bg-indigo-600,
        html[data-accent]:not([data-accent="violet"]) .bg-indigo-500,
        html[data-accent]:not([data-accent="violet"]) .bg-\[\#6957FF\] {
          background-color: var(--accent-gradient-start) !important;
        }
        html[data-accent]:not([data-accent="violet"]) .hover\:bg-indigo-500:hover,
        html[data-accent]:not([data-accent="violet"]) .hover\:bg-indigo-600:hover,
        html[data-accent]:not([data-accent="violet"]) .hover\:bg-\[\#5A48F0\]:hover {
          background-color: var(--accent-gradient-end) !important;
        }
        html[data-accent]:not([data-accent="violet"]) .text-indigo-600,
        html[data-accent]:not([data-accent="violet"]) .text-indigo-500,
        html[data-accent]:not([data-accent="violet"]) .text-indigo-400,
        html[data-accent]:not([data-accent="violet"]) .text-\[\#6957FF\],
        html[data-accent]:not([data-accent="violet"]) .dark\:text-\[\#857CFF\] {
          color: var(--accent-hex) !important;
        }
        html[data-accent]:not([data-accent="violet"]) .border-indigo-500,
        html[data-accent]:not([data-accent="violet"]) .border-indigo-500\/30,
        html[data-accent]:not([data-accent="violet"]) .border-indigo-500\/40,
        html[data-accent]:not([data-accent="violet"]) .border-\[\#6957FF\]\/30 {
          border-color: rgba(var(--primary-rgb), 0.38) !important;
        }
        html[data-accent]:not([data-accent="violet"]) .bg-indigo-500\/10,
        html[data-accent]:not([data-accent="violet"]) .bg-indigo-500\/15,
        html[data-accent]:not([data-accent="violet"]) .bg-indigo-500\/20,
        html[data-accent]:not([data-accent="violet"]) .bg-\[\#6957FF\]\/10,
        html[data-accent]:not([data-accent="violet"]) .bg-\[\#6957FF\]\/15 {
          background-color: rgba(var(--primary-rgb), 0.14) !important;
        }

        .glass-panel, .auth-panel, aside, header { 
          background: rgba(255, 255, 255, 0.72) !important;
          backdrop-filter: blur(32px) saturate(210%) !important;
          -webkit-backdrop-filter: blur(32px) saturate(210%) !important;
          border: 1px solid rgba(255, 255, 255, 0.70) !important;
          box-shadow: 
            0 14px 40px rgba(15, 23, 42, 0.05),
            0 1px 0.5px rgba(255, 255, 255, 0.90) inset,
            0 -1px 0.5px rgba(255, 255, 255, 0.30) inset !important;
          border-radius: 30px !important;
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        html.dark .glass-panel, html.dark .auth-panel, html.dark aside, html.dark header {
          background: rgba(13, 18, 30, 0.72) !important;
          backdrop-filter: blur(32px) saturate(210%) !important;
          -webkit-backdrop-filter: blur(32px) saturate(210%) !important;
          border: 1px solid rgba(255, 255, 255, 0.14) !important;
          box-shadow: 
            0 16px 44px rgba(0, 0, 0, 0.45),
            0 1px 0.5px rgba(255, 255, 255, 0.18) inset,
            0 -1px 0.5px rgba(255, 255, 255, 0.05) inset !important;
        }

        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="submit"]):not([type="button"]), textarea, select {
          width: 100%;
          padding: 0.75rem 1.1rem !important;
          box-sizing: border-box !important;
          font-size: 0.875rem;
          line-height: 1.5;
          border-radius: 14px !important;
          background: rgba(255, 255, 255, 0.55) !important;
          backdrop-filter: blur(16px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.60) !important;
          color: #1F2937 !important;
          box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
          transition: all 0.25s ease-out;
        }

        textarea {
          padding: 0.85rem 1.1rem !important;
          min-height: 80px;
        }

        html.dark input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="submit"]):not([type="button"]), html.dark textarea, html.dark select {
          background: rgba(15, 23, 42, 0.50) !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          color: #F8FAFC !important;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.08) !important;
        }

        input:focus, textarea:focus, select:focus {
          border-color: var(--accent-hex) !important;
          background: rgba(255, 255, 255, 0.75) !important;
          box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.20), inset 0 1px 2px rgba(255, 255, 255, 0.6) !important;
        }

        html.dark input:focus, html.dark textarea:focus, html.dark select:focus {
          background: rgba(15, 23, 42, 0.70) !important;
          box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.30), inset 0 1px 2px rgba(255, 255, 255, 0.1) !important;
        }

        .animate-modal-appear, [role="dialog"] {
          border-radius: 32px !important;
          background: rgba(255, 255, 255, 0.72) !important;
          backdrop-filter: blur(28px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.55) !important;
          box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(255, 255, 255, 0.4) inset !important;
        }

        html.dark .animate-modal-appear, html.dark [role="dialog"] {
          background: rgba(15, 23, 42, 0.75) !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(255, 255, 255, 0.1) inset !important;
        }

        .bg-slate-100\/70, .bg-slate-800\/50, .bg-white\/80, .bg-slate-700\/70, .bg-slate-900\/40, .bg-white\/90 {
          border-radius: 28px !important;
          backdrop-filter: blur(20px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
        }

        html:not(.dark) .bg-slate-100\/70, html:not(.dark) .bg-white\/80, html:not(.dark) .bg-white\/90 {
          background-color: rgba(255, 255, 255, 0.60) !important;
          border-color: rgba(255, 255, 255, 0.45) !important;
          box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.6) !important;
        }

        html.dark .bg-slate-800\/50, html.dark .bg-slate-700\/70, html.dark .bg-slate-900\/40 {
          background-color: rgba(15, 23, 42, 0.60) !important;
          border-color: rgba(255, 255, 255, 0.12) !important;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
        }

        button.bg-gradient-to-br, button[type="submit"], .hero-cta-primary {
          border-radius: 9999px !important;
          background: linear-gradient(135deg, var(--accent-gradient-start) 0%, var(--accent-gradient-end) 100%) !important;
          box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.28), 0 2px 4px rgba(255, 255, 255, 0.35) inset !important;
          transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
          border: 1px solid rgba(255, 255, 255, 0.25) !important;

        button.bg-gradient-to-br:hover, button[type="submit"]:hover, .hero-cta-primary:hover {
          transform: translateY(-1px) scale(1.02) !important;
          box-shadow: 0 12px 28px rgba(var(--primary-rgb), 0.38), 0 2px 4px rgba(255, 255, 255, 0.45) inset !important;
          background: linear-gradient(135deg, var(--accent-hex) 0%, var(--accent-gradient-start) 100%) !important;
        }

        .scrollbar-thin { 
          scrollbar-width: thin;

        }

          width: 6px; 
          height: 6px; 
        }
        .scrollbar-thin::-webkit-scrollbar-track { 
          background: transparent; 
        }
        .scrollbar-thin::-webkit-scrollbar-thumb { 
          background-color: rgba(148, 163, 184, 0.35); 
          border-radius: 9999px; 
          border: 1px solid transparent; 
          background-clip: content-box; 
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { 
          background-color: rgba(105, 87, 255, 0.6); 
        }

        .rounded-squircle-md, [role="menu"] {
          border-radius: 20px !important;
        }

        .rounded-full {

        }

        label { @apply text-sm font-normal tracking-wide; color: #1F2937; }

      @layer utilities {
        .truncate-2-lines { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .text-shadow-subtle { text-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }

        .global-spinner { @apply w-12 h-12 border-4 border-[#6957FF] border-t-transparent rounded-full animate-spinner; }
        .checkmark-icon-container { @apply absolute inset-y-0 right-0 top-0 pr-3 flex items-center pointer-events-none; }
        .checkmark-icon { @apply inline-block w-5 h-5 text-emerald-500 animate-checkmarkAppear; }

        .text-gradient-accent { @apply bg-gradient-to-r from-[#6957FF] to-[#857CFF] bg-clip-text text-transparent; }
        .text-gradient-neon { @apply bg-gradient-to-r from-[#6957FF] to-[#78B7FF] bg-clip-text text-transparent; }
      }

      @keyframes popupZoomIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes popupZoomOut {
        0% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        100% {
          opacity: 0;
          transform: scale(0.95) translateY(-6px);
        }
      }
      @keyframes popupUpZoomIn {
        0% {
          opacity: 0;
          transform: scale(0.95) translateY(6px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes popupUpZoomOut {
        0% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        100% {
          opacity: 0;
          transform: scale(0.95) translateY(6px);
        }
      }
      @keyframes modalZoomIn {
        0% {
          opacity: 0;
          transform: scale(0.94) translateY(10px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes modalZoomOut {
        0% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        100% {
          opacity: 0;
          transform: scale(0.94) translateY(10px);
        }
      }
      @keyframes tourRingPulse {
        0%, 100% {
          box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.85), 0 0 0 6px rgba(99, 102, 241, 0.18), 0 0 24px rgba(56, 189, 248, 0.35);
        }
        50% {
          box-shadow: 0 0 0 2.5px rgba(56, 189, 248, 0.95), 0 0 0 10px rgba(99, 102, 241, 0.08), 0 0 32px rgba(99, 102, 241, 0.45);
        }
      }
      .animate-popup-in {
        animation: popupZoomIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: top right;
      }
      .animate-popup-out {
        animation: popupZoomOut 0.16s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        transform-origin: top right;
        pointer-events: none;
      }
      .animate-popup-up-in {
        animation: popupUpZoomIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: bottom left;
      }
      .animate-popup-up-out {
        animation: popupUpZoomOut 0.16s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        transform-origin: bottom left;
        pointer-events: none;
      }
      .animate-modal-appear {
        animation: modalZoomIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .animate-modal-disappear {
        animation: modalZoomOut 0.19s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        pointer-events: none;
      }
      .tour-spotlight-ring {
        animation: tourRingPulse 2.2s ease-in-out infinite;
      }
