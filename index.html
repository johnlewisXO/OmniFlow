<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni Flow</title> <!-- Default Title -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              display: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'], 
            },
            colors: {
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                light: 'hsl(var(--primary-light))',
                dark: 'hsl(var(--primary-dark))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                light: 'hsl(var(--accent-light))',
                dark: 'hsl(var(--accent-dark))',
              },
              background: 'hsl(var(--page-background))', 
              foreground: 'hsl(var(--page-foreground))', 
              
              'panel-light': 'var(--panel-bg-light)', 
              'panel-dark': 'var(--panel-bg-dark)',    
              
              'border-light': 'var(--panel-border-light)', 
              'border-dark': 'var(--panel-border-dark)',

              card: 'hsl(var(--card))',
              'dark-card': 'hsl(var(--dark-card))',

              // Pastel Palette Tokens
              'soft-blue': '#78B7FF',
              'soft-orange': '#FF9E72',
              'soft-lavender': '#D8CCFF',
              'soft-peach': '#FFD8CC',
              'soft-mint': '#C8F5E3',
              'soft-rose': '#FFD6E6',

              // Semantic Text Tokens
              'text-primary': '#1F2937',
              'text-secondary': '#64748B',
              'text-muted': '#94A3B8',
              'text-disabled': '#CBD5E1',

              'neon-accent': 'hsl(var(--neon-accent))', 
              'neon-accent-secondary': 'hsl(var(--neon-accent-secondary))',
              'landing-bg': 'hsl(var(--landing-bg))',
              'landing-bg-darker': 'hsl(var(--landing-bg-darker))',
              'landing-border': 'hsl(var(--landing-border))',

              // Status colors
              status_success: 'hsl(var(--status-success))',
              status_warning: 'hsl(var(--status-warning))',
              status_error: 'hsl(var(--status-error))',
              status_neutral: 'hsl(var(--status-neutral))',
              status_info: 'hsl(var(--status-info))',
            },
            borderRadius: {
              'none': '0px',
              'sm': '1rem',      // 16px Tooltips
              'md': '1.25rem',   // 20px Dropdowns
              'lg': '1.5rem',    // 24px Popovers
              'xl': '1.875rem',  // 30px Panels, Sidebar, Header
              '2xl': '1.75rem',  // 28px Cards
              '3xl': '2rem',      // 32px Modals
              '4xl': '2.25rem',
              'full': '9999px',  // Buttons, Badges, Progress
              'squircle-sm': '1.125rem', // 18px Inputs
              'squircle-md': '1.75rem',  // 28px Cards
              'squircle-lg': '1.875rem', // 30px Panels
            },
            boxShadow: {
              'glass': '0 10px 30px rgba(15, 23, 42, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.60)',
              'glass-lg': '0 18px 40px rgba(15, 23, 42, 0.07), inset 0 1px 1px rgba(255, 255, 255, 0.70)',
              'inner-glass': 'inset 0 1px 2px 0 rgba(255, 255, 255, 0.6), inset 0 0.5px 1px 0 rgba(255, 255, 255, 0.3)',
              'subtle-glow-light': '0 0 20px 5px rgba(105, 87, 255, 0.15)',
              'subtle-glow-dark': '0 0 25px 5px rgba(105, 87, 255, 0.25)',
              'level-1': '0 2px 8px rgba(15, 23, 42, 0.04)',
              'level-2': '0 8px 24px rgba(15, 23, 42, 0.05)',
              'level-3': '0 18px 40px rgba(15, 23, 42, 0.07)',
            },
            keyframes: {
              slowGradientShift: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              spinner: { 'to': { transform: 'rotate(360deg)' } },
              checkmarkAppear: {
                '0%': { opacity: '0', transform: 'scale(0.5) rotate(-45deg)' },
                '70%': { opacity: '1', transform: 'scale(1.1) rotate(0deg)' },
                '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)' },
              },
              faqOpen: { '0%': { opacity: '0', transform: 'translateY(-8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' },
              },
              gridPan: {
                '0%': { 'background-position': '0% 0%' },
                '100%': { 'background-position': '100% 100%' },
              },
              globeCoreSpin: {
                'from': { transform: 'rotateY(0deg) rotateX(0deg)' },
                'to': { transform: 'rotateY(360deg) rotateX(360deg)' },
              },
              globeOrbit1: {
                'from': { transform: 'rotateZ(0deg) rotateY(65deg) rotateX(10deg)' },
                'to': { transform: 'rotateZ(360deg) rotateY(65deg) rotateX(10deg)' },
              },
              globeOrbit2: {
                'from': { transform: 'rotateZ(0deg) rotateY(-65deg) rotateX(15deg)' },
                'to': { transform: 'rotateZ(-360deg) rotateY(-65deg) rotateX(15deg)' },
              },
              globeOrbit3: {
                'from': { transform: 'rotateY(0deg) rotateX(80deg) rotateZ(20deg)' },
                'to': { transform: 'rotateY(360deg) rotateX(80deg) rotateZ(20deg)' },
              },
              satellitePulse: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 4px 1px hsla(var(--neon-accent-secondary-rgb), 0.7)' },
                '50%': { transform: 'scale(1.2)', boxShadow: '0 0 8px 3px hsla(var(--neon-accent-secondary-rgb), 0.9)' },
              },
              floatUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            },
            animation: {
              slowGradientShift: 'slowGradientShift 45s ease infinite',
              fadeIn: 'fadeIn 0.4s ease-out forwards',
              spinner: 'spinner 0.7s linear infinite',
              checkmarkAppear: 'checkmarkAppear 0.35s ease-out forwards',
              faqOpen: 'faqOpen 0.25s ease-out forwards',
              shimmer: 'shimmer 2s infinite linear',
              gridPan: 'gridPan 120s linear infinite alternate',
              floatUp: 'floatUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards',
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        :root {
          /* Light Mode - 2026 Apple Liquid Glass Aesthetic */
          --page-background-base-light: 220 25% 97%; /* #F5F7FB */
          --page-foreground-light: 215 28% 17%; /* #1F2937 */
          --panel-bg-light: 0 0% 100%;
          --panel-border-light: 220 30% 90%;
          --card-bg-light: 0 0% 100%;
          --card-border-light: 220 30% 90%;

          /* Modern Purple Primary (#6957FF) */
          --primary: 245 100% 67%; /* #6957FF */
          --primary-rgb: 105, 87, 255; 
          --primary-light: 244 100% 72%; /* #857CFF */
          --primary-dark: 246 84% 58%; /* #5544E8 */
          --primary-foreground: 0 0% 100%;
          --accent: var(--primary);
          --accent-rgb: var(--primary-rgb);
          --accent-light: var(--primary-light);
          --accent-dark: var(--primary-dark);
          --shadow-color-rgb: 15, 23, 42;
          
          /* Status Colors */
          --status-success: 145 63% 49%;
          --status-warning: 35 84% 62%;
          --status-error: 0 72% 51%;  
          --status-neutral: 215 20% 65%;
          --status-info: 200 80% 55%; 

          /* Landing Page Colors */
          --neon-accent: 245 100% 67%; 
          --neon-accent-rgb: 105, 87, 255;
          --neon-accent-secondary: 212 100% 73%;
          --neon-accent-secondary-rgb: 120, 183, 255;
          --landing-bg: 240 20% 10%;
          --landing-bg-darker: 240 25% 7%;
          --landing-border: 240 15% 20%;
        }

        html.dark { 
          --page-background-base-dark: 222 47% 11%; /* #0F172A */
          --page-foreground-dark: 210 40% 96%; /* #F8FAFC */
          --panel-bg-dark: 222 47% 11%;
          --panel-border-dark: 217 33% 20%;
          --card-bg-dark: 222 47% 11%;
          --card-border-dark: 217 33% 20%;
          --shadow-color-rgb: 0, 0, 0;
          --primary: 244 100% 72%; /* #857CFF */
          --primary-rgb: 133, 124, 255;
          --primary-foreground: 222 47% 11%;
        }
        
        :root {
          --page-background: var(--page-background-base-light);
          --page-foreground: var(--page-foreground-light);
          --panel-background: var(--panel-bg-light);
          --panel-border: var(--panel-border-light);
          --card-background: var(--card-bg-light);
          --card-border: var(--card-border-light);
        }
        html.dark {
          --page-background: var(--page-background-base-dark);
          --page-foreground: var(--page-foreground-dark);
          --panel-background: var(--panel-bg-dark);
          --panel-border: var(--panel-border-dark);
          --card-background: var(--card-bg-dark);
          --card-border: var(--card-border-dark);
        }

        body { 
          color: #1F2937;
          background-color: #F5F7FB;
          background-image: 
            radial-gradient(at 0% 0%, rgba(216, 204, 255, 0.35) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(120, 183, 255, 0.30) 0px, transparent 50%),
            radial-gradient(at 50% 100%, rgba(200, 245, 227, 0.25) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(255, 216, 204, 0.25) 0px, transparent 50%),
            linear-gradient(135deg, #F8FAFC 0%, #F5F7FB 50%, #EEF3F7 100%);
          background-attachment: fixed;
          font-family: theme('fontFamily.sans');
          line-height: 1.6;
          transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        html.dark body {
          color: #F8FAFC;
          background-color: #0F172A;
          background-image: 
            radial-gradient(at 0% 0%, rgba(105, 87, 255, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(120, 183, 255, 0.12) 0px, transparent 50%),
            radial-gradient(at 50% 100%, rgba(200, 245, 227, 0.08) 0px, transparent 50%),
            linear-gradient(135deg, #0B0F19 0%, #0F172A 50%, #1E1B4B 100%);
          background-attachment: fixed;
        }

        .glass-panel, .auth-panel, aside, header { 
          background: rgba(255, 255, 255, 0.65) !important;
          backdrop-filter: blur(26px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(26px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.50) !important;
          box-shadow: 
            0 10px 30px rgba(15, 23, 42, 0.05),
            0 2px 6px rgba(255, 255, 255, 0.30) inset !important;
          border-radius: 30px !important;
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        html.dark .glass-panel, html.dark .auth-panel, html.dark aside, html.dark header {
          background: rgba(15, 23, 42, 0.65) !important;
          backdrop-filter: blur(26px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(26px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.12) !important;
          box-shadow: 
            0 10px 30px rgba(0, 0, 0, 0.35),
            0 2px 6px rgba(255, 255, 255, 0.10) inset !important;
        }

        input[type="text"], input[type="email"], input[type="password"], input[type="date"], textarea, select {
          border-radius: 18px !important;
          background: rgba(255, 255, 255, 0.55) !important;
          backdrop-filter: blur(16px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.60) !important;
          color: #1F2937 !important;
          box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
          transition: all 0.25s ease-out;
        }

        html.dark input[type="text"], html.dark input[type="email"], html.dark input[type="password"], html.dark input[type="date"], html.dark textarea, html.dark select {
          background: rgba(15, 23, 42, 0.50) !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          color: #F8FAFC !important;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.08) !important;
        }

        input:focus, textarea:focus, select:focus {
          border-color: #6957FF !important;
          background: rgba(255, 255, 255, 0.75) !important;
          box-shadow: 0 0 0 3px rgba(105, 87, 255, 0.20), inset 0 1px 2px rgba(255, 255, 255, 0.6) !important;
        }

        html.dark input:focus, html.dark textarea:focus, html.dark select:focus {
          background: rgba(15, 23, 42, 0.70) !important;
          box-shadow: 0 0 0 3px rgba(105, 87, 255, 0.30), inset 0 1px 2px rgba(255, 255, 255, 0.1) !important;
        }

        .animate-modal-appear, [role="dialog"] {
          border-radius: 32px !important;
          background: rgba(255, 255, 255, 0.72) !important;
          backdrop-filter: blur(28px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.55) !important;
          box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(255, 255, 255, 0.4) inset !important;
        }

        html.dark .animate-modal-appear, html.dark [role="dialog"] {
          background: rgba(15, 23, 42, 0.75) !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(255, 255, 255, 0.1) inset !important;
        }

        .bg-slate-100\/70, .bg-slate-800\/50, .bg-white\/80, .bg-slate-700\/70, .bg-slate-900\/40, .bg-white\/90 {
          border-radius: 28px !important;
          backdrop-filter: blur(20px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
        }

        html:not(.dark) .bg-slate-100\/70, html:not(.dark) .bg-white\/80, html:not(.dark) .bg-white\/90 {
          background-color: rgba(255, 255, 255, 0.60) !important;
          border-color: rgba(255, 255, 255, 0.45) !important;
          box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.6) !important;
        }

        html.dark .bg-slate-800\/50, html.dark .bg-slate-700\/70, html.dark .bg-slate-900\/40 {
          background-color: rgba(15, 23, 42, 0.60) !important;
          border-color: rgba(255, 255, 255, 0.12) !important;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
        }

        button.bg-gradient-to-br, button[type="submit"], .hero-cta-primary {
          border-radius: 9999px !important;
          background: linear-gradient(135deg, #7668FF 0%, #6957FF 50%, #5B4AEE 100%) !important;
          box-shadow: 0 8px 20px rgba(105, 87, 255, 0.28), 0 2px 4px rgba(255, 255, 255, 0.35) inset !important;
          transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
          border: 1px solid rgba(255, 255, 255, 0.25) !important;
        }

        button.bg-gradient-to-br:hover, button[type="submit"]:hover, .hero-cta-primary:hover {
          transform: translateY(-1px) scale(1.02) !important;
          box-shadow: 0 12px 28px rgba(105, 87, 255, 0.38), 0 2px 4px rgba(255, 255, 255, 0.45) inset !important;
          background: linear-gradient(135deg, #857CFF 0%, #7668FF 50%, #6957FF 100%) !important;
        }

        .scrollbar-thin { 
          scrollbar-width: thin; 
          scrollbar-color: rgba(148, 163, 184, 0.4) transparent; 
        }
        .scrollbar-thin::-webkit-scrollbar { 
          width: 6px; 
          height: 6px; 
        }
        .scrollbar-thin::-webkit-scrollbar-track { 
          background: transparent; 
        }
        .scrollbar-thin::-webkit-scrollbar-thumb { 
          background-color: rgba(148, 163, 184, 0.35); 
          border-radius: 9999px; 
          border: 1px solid transparent; 
          background-clip: content-box; 
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { 
          background-color: rgba(105, 87, 255, 0.6); 
        }

        .rounded-squircle-md, [role="menu"] {
          border-radius: 20px !important;
        }

        .rounded-full {
          border-radius: 9999px !important;
        }

        label { @apply text-sm font-medium tracking-wide; color: #1F2937; }
        html.dark label { color: #CBD5E1; }
      }
      
      @layer utilities {
        .truncate-2-lines { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .text-shadow-subtle { text-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
        .global-spinner-overlay { @apply fixed inset-0 z-[100] flex items-center justify-center; background-color: rgba(245, 247, 251, 0.6); @apply backdrop-blur-md; }
        .global-spinner { @apply w-12 h-12 border-4 border-[#6957FF] border-t-transparent rounded-full animate-spinner; }
        .checkmark-icon-container { @apply absolute inset-y-0 right-0 top-0 pr-3 flex items-center pointer-events-none; }
        .checkmark-icon { @apply inline-block w-5 h-5 text-emerald-500 animate-checkmarkAppear; }

        .text-gradient-accent { @apply bg-gradient-to-r from-[#6957FF] to-[#857CFF] bg-clip-text text-transparent; }
        .text-gradient-neon { @apply bg-gradient-to-r from-[#6957FF] to-[#78B7FF] bg-clip-text text-transparent; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</script>
