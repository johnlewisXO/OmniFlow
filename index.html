<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni Flow</title>
    <meta name="description" content="Omni Flow: AI-powered project management. Beautifully efficient. Streamline workflows, foster collaboration, and achieve goals with intelligent precision." />
    <meta property="og:title" content="Omni Flow" />
    <meta property="og:description" content="Omni Flow: AI-powered project management. Beautifully efficient. Streamline workflows, foster collaboration, and achieve goals with intelligent precision." />
    <script>
      (function () {
        var origWarn = console.warn;
        var origError = console.error;
        console.warn = function () {
          var first = arguments[0] && typeof arguments[0] === 'string' ? arguments[0] : '';
          if (
            first.indexOf('cdn.tailwindcss.com') !== -1 ||
            first.indexOf('width(-1) and height(-1) of chart') !== -1
          ) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        console.error = function () {
          var first = arguments[0] && typeof arguments[0] === 'string' ? arguments[0] : '';
          if (first.indexOf('[vite] failed to connect to websocket') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e && e.reason && e.reason.message ? String(e.reason.message) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"DM Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                light: 'hsl(var(--primary-light))',
                dark: 'hsl(var(--primary-dark))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                light: 'hsl(var(--accent-light))',
                dark: 'hsl(var(--accent-dark))',
              },
              background: 'hsl(var(--page-background))',
              foreground: 'hsl(var(--page-foreground))',
              stone: {
                canvas: 'var(--bg-canvas)',
                surface: 'var(--bg-surface)',
                subtle: 'var(--bg-surface-subtle)',
                sage: 'var(--bg-sage)',
                bezel: 'var(--bg-bezel)',
                hairline: 'var(--border-hairline)',
              },
              limeAccent: 'var(--accent-lime)',
              charcoalInk: 'var(--accent-ink)',
              'panel-light': 'var(--panel-bg-light)',
              'panel-dark': 'var(--panel-bg-dark)',
              'border-light': 'var(--panel-border-light)',
              'border-dark': 'var(--panel-border-dark)',
              card: 'hsl(var(--card))',
              'dark-card': 'hsl(var(--dark-card))',
              'neon-accent': 'hsl(var(--neon-accent))',
              'neon-accent-secondary': 'hsl(var(--neon-accent-secondary))',
              'landing-bg': 'hsl(var(--landing-bg))',
              'landing-bg-darker': 'hsl(var(--landing-bg-darker))',
              'landing-border': 'hsl(var(--landing-border))',
              status_success: 'hsl(var(--status-success))',
              status_warning: 'hsl(var(--status-warning))',
              status_error: 'hsl(var(--status-error))',
              status_neutral: 'hsl(var(--status-neutral))',
              status_info: 'hsl(var(--status-info))',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              spinner: { 'to': { transform: 'rotate(360deg)' } },
              checkmarkAppear: {
                '0%': { opacity: '0', transform: 'scale(0.5) rotate(-45deg)' },
                '70%': { opacity: '1', transform: 'scale(1.1) rotate(0deg)' },
                '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)' },
              },
              faqOpen: { '0%': { opacity: '0', transform: 'translateY(-8px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' },
              },
              floatUp: { '0%': { transform: 'translateY(16px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              modalZoomIn: {
                '0%': { opacity: '0', transform: 'scale(0.96) translateY(6px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              modalZoomOut: {
                '0%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                '100%': { opacity: '0', transform: 'scale(0.97) translateY(4px)' },
              },
            },
            animation: {
              fadeIn: 'fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              spinner: 'spinner 0.7s linear infinite',
              checkmarkAppear: 'checkmarkAppear 0.35s ease-out forwards',
              faqOpen: 'faqOpen 0.2s ease-out forwards',
              shimmer: 'shimmer 2s infinite linear',
              floatUp: 'floatUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              modalZoomIn: 'modalZoomIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              modalZoomOut: 'modalZoomOut 0.15s cubic-bezier(0.4, 0, 1, 1) forwards',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

}
</script>

  </head>
